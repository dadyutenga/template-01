<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kibegi — Student App (UI Kit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="kit.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const USER = { name: "Asha Mwangi", initials: "AM", role: "student" };

function App() {
  const [authed, setAuthed] = useState(true);
  const [tab, setTab] = useState("dashboard");
  const [sidebar, setSidebar] = useState(false);
  const [lang, setLang] = useState("en");
  const [theme, setTheme] = useState("light");

  useEffect(() => { lucide.createIcons(); });

  const goTab = (t) => { setTab(t); window.scrollTo({ top: 0 }); };

  if (!authed) return <LoginScreen onLogin={() => { setAuthed(true); setTab("dashboard"); }} lang={lang} setLang={setLang} />;

  let screen;
  if (tab === "dashboard") screen = <DashboardScreen user={USER} lang={lang} onTab={goTab} />;
  else if (tab === "files") screen = <FilesScreen lang={lang} onTab={goTab} />;
  else if (tab === "classes") screen = <ClassesScreen lang={lang} onTab={goTab} />;
  else screen = <PlaceholderScreen tab={tab} lang={lang} onTab={goTab} />;

  return (
    <React.Fragment>
      <AppTopNav user={USER} onMenu={() => setSidebar(true)} onTab={goTab} lang={lang} setLang={setLang} theme={theme} setTheme={setTheme} />
      <AppSidebar open={sidebar} onClose={() => setSidebar(false)} user={USER} onTab={goTab} onLogout={() => { setAuthed(false); setSidebar(false); }} lang={lang} />
      {screen}
      <AppBottomNav tab={tab} onTab={goTab} lang={lang} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
