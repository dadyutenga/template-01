<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-display);}
  .scale{display:flex;flex-direction:column;gap:9px;}
  .line{display:flex;align-items:baseline;gap:16px;}
  .px{font-family:var(--font-sans);font-size:11px;color:var(--fg3);width:64px;flex-shrink:0;letter-spacing:.02em;}
  .sample{color:var(--fg1);letter-spacing:-0.02em;line-height:1.05;white-space:nowrap;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="font-family:var(--font-sans);margin-bottom:16px;">Type scale</div>
  <div class="scale">
    <div class="line"><span class="px">60 · display</span><span class="sample" style="font-size:46px;font-weight:900;">Aa Semester</span></div>
    <div class="line"><span class="px">36 · h1</span><span class="sample" style="font-size:34px;font-weight:800;">Aa Semester</span></div>
    <div class="line"><span class="px">24 · h2</span><span class="sample" style="font-size:24px;font-weight:700;">Aa Semester study materials</span></div>
    <div class="line"><span class="px">18 · h3</span><span class="sample" style="font-size:18px;font-weight:600;">Aa Semester study materials in one place</span></div>
    <div class="line"><span class="px">16 · body</span><span class="sample" style="font-family:var(--font-sans);font-size:16px;font-weight:400;letter-spacing:0;color:var(--fg2);">Aa Semester study materials in one secure place</span></div>
    <div class="line"><span class="px">13.6 · meta</span><span class="sample" style="font-family:var(--font-sans);font-size:13.6px;font-weight:400;letter-spacing:0;color:var(--fg3);">Aa Updated 2h ago · 12 files</span></div>
  </div>
</div>
</body>
</html>
