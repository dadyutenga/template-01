<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .sw{display:flex;gap:12px;}
  .chip{flex:1;border-radius:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:11px;box-sizing:border-box;box-shadow:var(--shadow-sm);}
  .name{font-size:12px;font-weight:700;}
  .hex{font-size:10.5px;opacity:.85;margin-top:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Neutrals · Cool Slate</div>
  <div class="sw">
    <div class="chip" style="background:hsl(210 40% 98%);color:hsl(215 25% 25%);border:1px solid var(--border);"><span class="name">Background</span><span class="hex">210 40% 98%</span></div>
    <div class="chip" style="background:hsl(210 40% 96%);color:hsl(215 25% 25%);border:1px solid var(--border);"><span class="name">Muted</span><span class="hex">210 40% 96%</span></div>
    <div class="chip" style="background:hsl(215 25% 88%);color:hsl(215 25% 25%);"><span class="name">Border</span><span class="hex">215 25% 88%</span></div>
    <div class="chip" style="background:hsl(215 15% 50%);color:#fff;"><span class="name">Muted fg</span><span class="hex">215 15% 50%</span></div>
    <div class="chip" style="background:hsl(215 25% 15%);color:#fff;"><span class="name">Foreground</span><span class="hex">215 25% 15%</span></div>
  </div>
</div>
</body>
</html>
