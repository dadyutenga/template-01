<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);display:flex;gap:26px;align-items:center;}
  .lockup{display:flex;align-items:center;gap:14px;}
  .lockup img{width:64px;height:64px;}
  .name{font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--fg1);letter-spacing:-0.01em;}
  .tagline{font-size:13px;color:var(--fg2);margin-top:2px;}
  .onbrand{margin-left:auto;display:flex;gap:14px;align-items:center;}
  .tile{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .tile img{width:46px;height:46px;}
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <img src="../assets/kibegi-logo.png" alt="Kibegi">
    <div>
      <div class="name">Kibegi</div>
      <div class="tagline">Your Digital School Bag</div>
    </div>
  </div>
  <div class="onbrand">
    <div class="tile" style="background:var(--bg);border:1px solid var(--border);"><img src="../assets/kibegi-logo.png" alt=""></div>
    <div class="tile" style="background:var(--gradient-primary);"><img src="../assets/kibegi-logo-192.png" alt=""></div>
    <div class="tile" style="background:hsl(215 25% 15%);"><img src="../assets/kibegi-logo.png" alt=""></div>
  </div>
</div>
</body>
</html>
