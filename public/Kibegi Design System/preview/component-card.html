<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;background:var(--bg);}
  .wrap{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);display:flex;gap:16px;}
  .filecard{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);background:hsl(210 40% 96% / .5);border-radius:18px;padding:16px;}
  .left{display:flex;gap:12px;align-items:flex-start;min-width:0;}
  .chip{background:var(--primary-tint);color:var(--primary);border-radius:14px;padding:11px;display:flex;}
  .chip svg{width:20px;height:20px;}
  .fname{font-weight:600;color:var(--fg1);font-size:15px;}
  .meta{font-size:13px;color:var(--fg2);margin-top:3px;}
  .badge{background:var(--muted);color:var(--fg2);border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="filecard">
    <div class="left">
      <div class="chip"><i data-lucide="file-text"></i></div>
      <div>
        <div class="fname">Algorithms — Past Paper 2024.pdf</div>
        <div class="meta">Shared file · Asha M. · 2h ago</div>
      </div>
    </div>
    <span class="badge">PDF</span>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
