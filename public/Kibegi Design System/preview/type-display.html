<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:26px 30px;box-sizing:border-box;}
  .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .tag{font-family:var(--font-sans);font-size:11px;color:var(--fg3);background:var(--muted);padding:2px 8px;border-radius:6px;}

<div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Display · Poppins Black</div>
  <div style="font-family:var(--font-display);font-weight:900;font-size:52px;line-height:1.02;letter-spacing:-0.02em;color:var(--fg1);">Never Lose Notes Again.</div>
  <div class="row" style="margin-top:18px;">
    <span class="tag">Poppins 900</span>
    <span class="tag">letter-spacing −0.02em</span>
    <span class="tag">hero / section titles</span>
  </div>
</div>

</html>
