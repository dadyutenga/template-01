<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:center;margin-top:14px;}
  .av{width:48px;height:48px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--primary);font-size:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .stack{display:flex;}
  .stack .av{width:38px;height:38px;font-size:13px;border:2px solid #fff;margin-left:-10px;background:hsl(187 85% 43% / .2);color:var(--primary);}
  .stack .av:first-child{margin-left:0;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Avatars — teal fallback, circular</div>
  <div class="row">
    <div class="av">AM</div>
    <div class="av" style="background:var(--secondary);color:hsl(215 25% 15%);">SK</div>
    <div class="av" style="background:hsl(142 70% 45%);">JN</div>
    <div class="stack" style="margin-left:8px;">
      <div class="av">JM</div><div class="av">SK</div><div class="av">AN</div><div class="av">ME</div>
    </div>
  </div>
</div>
</body>
</html>
