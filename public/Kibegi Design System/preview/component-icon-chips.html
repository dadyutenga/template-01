<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;}
  .chip{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .ic{border-radius:16px;padding:13px;display:flex;}
  .ic svg{width:22px;height:22px;}
  .lbl{font-size:11px;color:var(--fg2);font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Icon chips — rounded tint + Lucide</div>
  <div class="row">
    <div class="chip"><div class="ic" style="background:hsl(187 85% 43% / .1);color:var(--primary);"><i data-lucide="cloud-upload"></i></div><span class="lbl">Upload</span></div>
    <div class="chip"><div class="ic" style="background:hsl(187 85% 43% / .1);color:var(--primary);"><i data-lucide="folder-open"></i></div><span class="lbl">Files</span></div>
    <div class="chip"><div class="ic" style="background:hsl(258 70% 60% / .12);color:hsl(258 55% 50%);"><i data-lucide="graduation-cap"></i></div><span class="lbl">Classes</span></div>
    <div class="chip"><div class="ic" style="background:hsl(160 70% 45% / .12);color:hsl(160 60% 32%);"><i data-lucide="share-2"></i></div><span class="lbl">Shared</span></div>
    <div class="chip"><div class="ic" style="background:hsl(25 95% 65% / .15);color:hsl(25 70% 45%);"><i data-lucide="calendar-days"></i></div><span class="lbl">Timetable</span></div>
    <div class="chip"><div class="ic" style="background:hsl(187 85% 43% / .1);color:var(--primary);"><i data-lucide="shield-check"></i></div><span class="lbl">Secure</span></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
