<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:flex-end;}
  .item{text-align:center;}
  .bar{background:var(--primary);border-radius:5px;width:34px;}
  .lbl{font-size:11px;color:var(--fg2);margin-top:8px;font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:18px;">Spacing scale · 4px base</div>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px;"></div><div class="lbl">2 · 8</div></div>
    <div class="item"><div class="bar" style="height:12px;"></div><div class="lbl">3 · 12</div></div>
    <div class="item"><div class="bar" style="height:16px;"></div><div class="lbl">4 · 16</div></div>
    <div class="item"><div class="bar" style="height:24px;"></div><div class="lbl">6 · 24</div></div>
    <div class="item"><div class="bar" style="height:32px;"></div><div class="lbl">8 · 32</div></div>
    <div class="item"><div class="bar" style="height:48px;"></div><div class="lbl">12 · 48</div></div>
    <div class="item"><div class="bar" style="height:64px;"></div><div class="lbl">16 · 64</div></div>
  </div>
  <div style="font-size:12px;color:var(--fg3);margin-top:16px;">Section rhythm: <strong>py 64 → 112px</strong> · container max-width 1280px · gutters 16 → 32px.</div>
</div>
</body>
</html>
