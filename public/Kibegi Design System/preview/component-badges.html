<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;}
  .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:4px 13px;font-size:12.5px;font-weight:600;}
  .lbl{font-size:11px;color:var(--fg3);margin:18px 0 0;font-weight:600;text-transform:uppercase;letter-spacing:.1em;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Badges &amp; chips</div>
  <div class="row">
    <span class="badge" style="background:var(--primary);color:#fff;">Default</span>
    <span class="badge" style="background:var(--muted);color:var(--fg2);">Secondary · PDF</span>
    <span class="badge" style="background:transparent;border:1px solid var(--border);color:var(--fg2);">Outline</span>
    <span class="badge" style="background:var(--destructive);color:#fff;">Overdue</span>
    <span class="badge" style="background:hsl(187 85% 43% / .05);border:1px solid hsl(187 85% 43% / .15);color:var(--primary);">CS101</span>
  </div>
  <div class="lbl">Eyebrow pill</div>
  <div class="row">
    <span class="badge" style="background:hsl(187 85% 43% / .05);border:1px solid hsl(187 85% 43% / .15);color:var(--primary);text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700;padding:5px 14px;">Ready to begin?</span>
    <span class="badge" style="background:hsl(142 70% 55% / .12);color:hsl(142 50% 28%);">Verified class</span>
  </div>
</div>
</body>
</html>
