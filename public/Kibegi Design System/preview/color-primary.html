<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .sw{display:flex;gap:14px;}
  .chip{flex:1;border-radius:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;box-shadow:var(--shadow-sm);}
  .name{font-size:12.5px;font-weight:700;}
  .hex{font-size:11px;opacity:.85;margin-top:2px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Primary · Kibegi Teal</div>
  <div class="sw">
    <div class="chip" style="background:hsl(187 85% 35%);color:#fff;"><span class="name">Strong</span><span class="hex">187 85% 35%</span></div>
    <div class="chip" style="background:hsl(187 85% 43%);color:#fff;"><span class="name">Primary</span><span class="hex">187 85% 43%</span></div>
    <div class="chip" style="background:hsl(187 85% 55%);color:#fff;"><span class="name">Soft</span><span class="hex">187 85% 55%</span></div>
    <div class="chip" style="background:hsl(187 85% 43% / .10);color:hsl(187 85% 30%);"><span class="name">Tint 10%</span><span class="hex">on chips/badges</span></div>
  </div>
</div>
</body>
</html>
