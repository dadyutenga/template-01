<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:26px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .tag{font-size:11px;color:var(--fg3);background:var(--muted);padding:2px 8px;border-radius:6px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:14px;">Body &amp; UI · Outfit</div>
  <div style="font-size:18px;font-weight:600;color:var(--fg1);margin-bottom:6px;">Store, share, and access study materials in one place.</div>
  <div style="font-size:16px;line-height:1.7;color:var(--fg2);max-width:560px;">Kibegi gives students one clean system for notes, schedules, sharing, and study organization — calm, reliable, and always within reach.</div>
  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
    <span class="tag">Outfit 400 / 500 / 600</span>
    <span class="tag">Inter fallback</span>
    <span class="tag">line-height 1.7</span>
  </div>
</div>
</body>
</html>
