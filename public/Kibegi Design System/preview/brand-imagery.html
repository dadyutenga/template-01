<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:0;box-sizing:border-box;font-family:var(--font-sans);display:flex;gap:0;overflow:hidden;}
  .img{flex:1;height:190px;background-size:cover;background-position:center;}
  .cap{position:absolute;bottom:10px;left:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border-radius:9999px;padding:4px 12px;font-size:11.5px;font-weight:600;color:var(--fg1);}
  .frame{position:relative;flex:1;}
</style>
</head>
<body>
<div class="card">
  <div class="frame"><div class="img" style="background-image:url('../assets/hero-students.jpeg');"></div><span class="cap">Photography · color-blocked students</span></div>
  <div class="frame"><div class="img" style="background-image:url('../assets/hero-education.jpg');"></div><span class="cap">Illustration · warm flat vector</span></div>
</div>
</body>
</html>
