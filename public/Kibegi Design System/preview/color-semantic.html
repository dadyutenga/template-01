<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:12px;align-items:stretch;}
  .chip{flex:1;border-radius:14px;height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:11px;box-sizing:border-box;box-shadow:var(--shadow-sm);}
  .name{font-size:12px;font-weight:700;}
  .hex{font-size:10.5px;opacity:.85;margin-top:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Semantic &amp; categorical</div>
  <div class="row">
    <div class="chip" style="background:hsl(0 72% 51%);color:#fff;"><span class="name">Destructive</span><span class="hex">0 72% 51%</span></div>
    <div class="chip" style="background:hsl(142 70% 55%);color:#fff;"><span class="name">Success</span><span class="hex">142 70% 55%</span></div>
    <div class="chip" style="background:hsl(258 70% 60% / .12);color:hsl(258 50% 45%);"><span class="name">Class · violet</span><span class="hex">tint 12%</span></div>
    <div class="chip" style="background:hsl(160 70% 45% / .12);color:hsl(160 60% 28%);"><span class="name">Shared · emerald</span><span class="hex">tint 12%</span></div>
    <div class="chip" style="background:hsl(187 85% 43% / .10);color:hsl(187 70% 28%);"><span class="name">Primary</span><span class="hex">tint 10%</span></div>
  </div>
</div>
</body>
</html>
