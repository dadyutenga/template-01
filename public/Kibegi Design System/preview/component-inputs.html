<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 30px;box-sizing:border-box;font-family:var(--font-sans);max-width:520px;}
  label{font-size:14px;font-weight:600;color:var(--fg1);display:block;margin-bottom:6px;}
  .field{position:relative;margin-bottom:14px;}
  input{width:100%;height:46px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;color:var(--fg1);box-sizing:border-box;background:#fff;}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px hsl(187 85% 43% / .15);}
  .with-icon input{padding-left:42px;}
  .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--fg3);}
  .ic svg{width:18px;height:18px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" style="margin-bottom:16px;">Form fields</div>
  <div class="field">
    <label>Email</label>
    <input type="email" placeholder="you@university.ac.tz">
  </div>
  <div class="field with-icon">
    <span class="ic"><i data-lucide="search"></i></span>
    <input type="text" placeholder="Search files, users, classes…">
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
